[package]
name = "stm32_os"
version = "0.1.0"
edition = "2021"

[dependencies]
aart-core = { path = "../aart-core" }
stm32g4xx-hal = { version = "0.1.0", features = ["stm32g431", "rt"] }
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.3"

defmt = "0.3.5"
defmt-rtt = "0.4.0"

[dev-dependencies]
defmt-test = "0.3.1"
panic-semihosting = "0.6.0"

# ADD THIS: Our QEMU toggle switch
[features]
default = []
qemu = []

[[bin]]
name = "stm32_os"
test = false
bench = false

[[test]]
name = "hal_test"
harness = false
