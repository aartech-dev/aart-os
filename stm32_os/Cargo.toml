[package]
name = "stm32_os"
version = "0.1.0"
edition = "2021"

[dependencies]
aart-core = { path = "../aart-core" }
stm32g4xx-hal = { version = "0.1.0", features = ["stm32g474", "rt"] }
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.3"
embedded-hal = "1.0.0"
embedded-io = "0.6"

defmt = "0.3.5"
defmt-rtt = "0.4.0"

[dev-dependencies]
defmt-test = "0.3.1"
panic-semihosting = "0.6.0"

# ADD THIS: Our QEMU toggle switch
[features]
default = []
qemu = []

[[bin]]
name = "stm32_os"
test = false
bench = false

[[test]]
name = "hal_test"
harness = false

# Kept even after the G474 retarget (512K flash, plenty of room): debug
# builds are still meaningfully faster to flash/run at opt-level "s", and
# `cargo hw`/`cargo qemu` both run through `cargo test`, which builds this
# bin target too (even though it's `test = false`).
[profile.dev]
opt-level = "s"
